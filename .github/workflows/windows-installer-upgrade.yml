name: Windows 覆盖升级验证

on:
  push:
    branches:
      - codex/windows-installer-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 验证旧版覆盖升级、文件占用恢复及数据保留
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          New-Item -ItemType Directory -Force output/windows-installer-upgrade | Out-Null
          node --test tests/windows-installer.test.mjs 2>&1 | Tee-Object output/windows-installer-upgrade/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保留验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-upgrade-${{ github.run_id }}
          path: output/windows-installer-upgrade/tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: 构建并检查 Windows 0.3.2 安装包
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run package:windows:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 实际安装并核对版本与程序完整性
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { existsSync, mkdtempSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const installer = path.resolve('output/electron/dyworker-0.3.2-windows-x64-setup.exe');
          assert.ok(existsSync(installer), '缺少 0.3.2 安装包');
          const installDir = path.join(mkdtempSync(path.join(os.tmpdir(), 'dyworker-package-')), 'DYWorker App');
          const install = spawnSync(installer, ['/S', '/currentuser', `/D=${installDir}`], {
            windowsVerbatimArguments: true, argv0: `"${installer}"`, timeout: 240000, encoding: 'utf8',
          });
          assert.ifError(install.error);
          assert.equal(install.status, 0, `安装失败：${install.stdout}\n${install.stderr}`);
          const exe = path.join(installDir, 'DYWorker.exe');
          assert.ok(existsSync(exe), '安装后缺少主程序');
          const archive = path.join(installDir, 'resources', 'app.asar');
          const probe = spawnSync(exe, ['-e', `const fs=require('node:fs'); const p=${JSON.stringify(archive)}; const pkg=require(p+'/package.json'); if(pkg.version!=='0.3.2')throw Error(pkg.version); if(!fs.existsSync(p+'/'+pkg.main))throw Error('missing main'); console.log('Windows installer verified: '+pkg.version+' '+process.platform+' '+process.arch);`], {
            env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' }, timeout: 30000, encoding: 'utf8',
          });
          assert.ifError(probe.error);
          assert.equal(probe.status, 0, `程序检查失败：${probe.stdout}\n${probe.stderr}`);
          assert.match(probe.stdout, /Windows installer verified: 0\.3\.2 win32 x64/);
          console.log(probe.stdout.trim());
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = 'output/electron/dyworker-0.3.2-windows-x64-setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  dyworker-0.3.2-windows-x64-setup.exe" | Set-Content "$installer.sha256" -Encoding ascii
      - name: 读取真实 0.3.1 版本源码
        uses: actions/checkout@v4
        with:
          ref: 560ba367529db08d77c0d404028e25858ab0704c
          path: output/legacy-source
      - name: 构建 0.3.1 完整升级基准包
        working-directory: output/legacy-source
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证 D 盘完整手动升级、再次安装及所有文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/legacy-installer | Out-Null
          Copy-Item output/legacy-source/output/electron/dyworker-0.3.1-windows-x64-setup.exe output/legacy-installer/
          node scripts/verify-windows-upgrade-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $original = 'output/electron/dyworker-0.3.2-windows-x64-setup.exe'
          $delivery = 'output/electron/dyworker-0.3.2-windows-x64-setup-fix2.exe'
          Move-Item $original $delivery
          $hash = (Get-FileHash $delivery -Algorithm SHA256).Hash.ToLower()
          "$hash  dyworker-0.3.2-windows-x64-setup-fix2.exe" | Set-Content "$delivery.sha256" -Encoding ascii
      - name: 提供 Windows 安装包下载
        uses: actions/upload-artifact@v4
        with:
          name: dyworker-0.3.2-windows-x64-installer-fix2
          path: |
            output/electron/dyworker-0.3.2-windows-x64-setup-fix2.exe
            output/electron/dyworker-0.3.2-windows-x64-setup-fix2.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
