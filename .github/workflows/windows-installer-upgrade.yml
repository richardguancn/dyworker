name: Windows 覆盖升级验证

on:
  push:
    branches:
      - codex/windows-installer-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 拉取测试代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 验证旧版覆盖升级、文件占用恢复及数据保留
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          New-Item -ItemType Directory -Force output/windows-installer-upgrade | Out-Null
          node --test tests/windows-installer.test.mjs 2>&1 | Tee-Object output/windows-installer-upgrade/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 保留验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-upgrade-${{ github.run_id }}
          path: output/windows-installer-upgrade/tests.log
          if-no-files-found: warn
          retention-days: 7
