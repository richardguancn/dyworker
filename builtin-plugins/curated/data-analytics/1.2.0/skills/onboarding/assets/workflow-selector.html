<div id="data-onboarding-workflow-selector">
  <style>
    #data-onboarding-workflow-selector .data-workflow-list {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    #data-onboarding-workflow-selector .data-workflow-choice {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      max-width: 100%;
      min-height: 40px;
      padding: 7px 15px 7px 11px;
      border: 1px solid color-mix(in srgb, var(--foreground) 7%, transparent);
      border-radius: 100px;
      background: var(--background);
      color: var(--foreground);
      font: inherit;
      font-size: var(--font-size-base);
      font-weight: 400;
      line-height: 1.4286;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    #data-onboarding-workflow-selector .data-workflow-icon {
      display: block;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }
    #data-onboarding-workflow-selector .data-workflow-choice:hover:not(:disabled) {
      background: var(--accent);
    }
    #data-onboarding-workflow-selector .data-workflow-choice:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    #data-onboarding-workflow-selector .data-workflow-choice:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #data-onboarding-workflow-selector [data-workflow-status]:empty {
      display: none;
    }
    @media (pointer: coarse) {
      #data-onboarding-workflow-selector .data-workflow-choice {
        min-height: 44px;
      }
    }
  </style>

</div>
<script>
(() => {
  const root = document.getElementById("data-onboarding-workflow-selector");
  const actions = root.querySelector("[data-workflow-actions]");
  const fallback = root.querySelector("[data-workflow-fallback]");
  const status = root.querySelector("[data-workflow-status]");
  const buttons = [...root.querySelectorAll("button[data-workflow]")];
  const workflows = {
    connect: {
      title: "Connect my data",
      prompt: "Help me connect my data sources to Data.",
    },
    "metric-change": {
      title: "Understand what changed with Data",
      prompt: "Help me investigate a metric change with Data.",
    },
    artifact: {
      title: "Build a dashboard or report with Data",
      prompt: "Help me build a dashboard or report with Data.",
    },
  };
  let pending = false;

  function updateAvailability() {
    const available = typeof window.openai?.sendFollowUpMessage === "function";
    actions.hidden = !available;
    fallback.hidden = available;
    return available;
  }

  updateAvailability();
  for (const button of buttons) {
    button.addEventListener("click", async () => {
      if (pending || !updateAvailability()) return;
      pending = true;
      for (const item of buttons) item.disabled = true;
      status.setAttribute("role", "status");
      status.textContent = "Confirm in the app to continue.";
      try {
        await window.openai.sendFollowUpMessage(workflows[button.dataset.workflow]);
        // The host can resolve after dismissal; resolution is not submission.
        status.textContent = "";
      } catch {
        status.setAttribute("role", "alert");
        status.textContent = "Could not open confirmation. Try again, or type your choice in the chat.";
        fallback.hidden = false;
      } finally {
        pending = false;
        for (const item of buttons) item.disabled = false;
      }
    });
  }
})();
</script>
